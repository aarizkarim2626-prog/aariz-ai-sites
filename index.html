<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Aariz's AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #100e1a;
    --bg-panel: #17142380;
    --bg-raised: #1d1930;
    --line: #2c2740;
    --ink: #ede9f7;
    --ink-dim: #948fb0;
    --gold: #f2b544;
    --gold-dim: #6b5a2c;
    --violet: #7c6cf0;
    --error: #f0655f;
    --radius: 18px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(1100px 600px at 85% -10%, #241c3d 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #1c2438 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  /* Sidebar */
  .sidebar{
    width:260px;
    background:#141021;
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:18px 14px;
    transition:transform .3s ease;
    z-index:1000;
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 6px 20px;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,var(--gold),var(--violet));
    flex-shrink:0;
  }
  .brand-text{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:.2px;
  }
  .brand-text span{color:var(--ink-dim);font-weight:500;font-size:11px;display:block;letter-spacing:.6px;text-transform:uppercase;}

  .new-chat-btn{
    background:var(--bg-raised);
    border:1px solid var(--line);
    color:var(--ink);
    padding:11px 14px;
    border-radius:12px;
    text-align:left;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    margin-bottom:22px;
    display:flex;
    align-items:center;
    gap:8px;
    transition:border-color .15s ease, background .15s ease;
  }
  .new-chat-btn:hover{border-color:var(--gold-dim); background:#221d38;}

  .section-label{
    color:var(--ink-dim);
    font-size:10.5px;
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
    margin:4px 8px 10px;
  }
  .recent-item{
    padding:9px 10px;
    font-size:12.5px;
    border-radius:10px;
    cursor:pointer;
    color:var(--ink-dim);
    margin-bottom:4px;
    font-family:'Space Grotesk',monospace;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .recent-item:hover{background:var(--bg-raised); color:var(--ink);}
  .tag{
    font-size:9.5px;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
    letter-spacing:.3px;
    flex-shrink:0;
  }
  .tag-py{background:#38bdf822;color:#38bdf8;}
  .tag-html{background:#f59e0b22;color:#f59e0b;}
  .tag-js{background:#10b98122;color:#10b981;}
  .tag-nb{background:#f472b622;color:#f472b6;}

  .sidebar-footer{
    margin-top:auto;
    font-size:11px;
    color:var(--ink-dim);
    padding:10px 8px;
    border-top:1px solid var(--line);
  }

  /* Main content */
  .main-content{
    flex:1;
    display:flex;
    flex-direction:column;
    position:relative;
    min-width:0;
  }
  header{
    padding:16px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .header-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:16px;
  }
  .header-sub{
    font-size:11.5px;
    color:var(--ink-dim);
    margin-top:2px;
  }
  #toggle-sidebar{
    display:none;
    font-size:22px;
    cursor:pointer;
    color:var(--gold);
    background:none;
    border:none;
  }
  .status-dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    background:#3ecf8e;
    margin-right:6px;
    box-shadow:0 0 6px #3ecf8e;
  }

  /* Chat window */
  #chat-window{
    flex:1;
    overflow-y:auto;
    padding:28px 24px 10px;
    display:flex;
    flex-direction:column;
    gap:22px;
    scroll-behavior:smooth;
  }
  #chat-window::-webkit-scrollbar{width:8px;}
  #chat-window::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}

  .msg-row{
    display:flex;
    gap:12px;
    align-items:flex-start;
    max-width:820px;
    width:100%;
    margin:0 auto;
  }
  .user-row{ justify-content:flex-end; }
  .user-row .bubble{ order:1; }

  .avatar{
    width:32px;
    height:32px;
    border-radius:10px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:700;
  }
  .ai-avatar{
    background:linear-gradient(135deg,var(--gold),var(--violet));
    color:#1a1428;
  }
  .user-avatar{
    background:var(--bg-raised);
    border:1px solid var(--line);
    color:var(--ink-dim);
  }
  .bubble{
    max-width:78%;
    line-height:1.55;
    font-size:14.5px;
    padding:12px 16px;
    border-radius:16px;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .user-bubble{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-top-right-radius:4px;
  }
  .ai-bubble{
    background:transparent;
    padding-left:0;
    padding-top:6px;
    border-top-left-radius:4px;
  }
  .ai-bubble.error{ color:var(--error); }

  .welcome{
    max-width:820px;
    margin:40px auto 0;
    text-align:left;
  }
  .welcome-logo{
    display:block;
    margin-bottom:14px;
  }
  .welcome h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:700;
    margin:0 0 8px;
    background:linear-gradient(90deg,var(--gold),var(--violet));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .welcome p{
    color:var(--ink-dim);
    font-size:14px;
    margin:0;
  }

  /* Typing indicator */
  .typing-dots{
    display:inline-flex;
    gap:4px;
    padding:6px 0;
  }
  .typing-dots span{
    width:6px;height:6px;
    border-radius:50%;
    background:var(--ink-dim);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:.15s;}
  .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{
    0%,60%,100%{ transform:translateY(0); opacity:.4; }
    30%{ transform:translateY(-5px); opacity:1; }
  }

  /* Input box */
  .input-wrap{
    flex-shrink:0;
    padding:14px 24px 22px;
    border-top:1px solid var(--line);
  }
  .input-container{
    max-width:820px;
    margin:0 auto;
    display:flex;
    background:var(--bg-raised);
    border-radius:26px;
    border:1px solid var(--line);
    padding:6px 6px 6px 20px;
    align-items:center;
    transition:border-color .15s ease;
  }
  .input-container:focus-within{
    border-color:var(--gold-dim);
  }
  .input-container input{
    flex:1;
    background:transparent;
    border:none;
    color:var(--ink);
    font-size:14.5px;
    font-family:'Inter',sans-serif;
    outline:none;
    padding:10px 0;
  }
  .input-container input::placeholder{ color:var(--ink-dim); }
  .input-container button{
    background:linear-gradient(135deg,var(--gold),var(--violet));
    border:none;
    border-radius:50%;
    color:#1a1428;
    width:38px;
    height:38px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .15s ease, opacity .15s ease;
  }
  .input-container button:hover{ transform:scale(1.06); }
  .input-container button:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
  .input-hint{
    max-width:820px;
    margin:8px auto 0;
    font-size:11px;
    color:var(--ink-dim);
    text-align:center;
  }

  /* Sidebar backdrop (mobile drawer overlay) */
  .sidebar-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(8,7,14,.6);
    -webkit-backdrop-filter:blur(2px);
    backdrop-filter:blur(2px);
    z-index:900;
    opacity:0;
    transition:opacity .25s ease;
  }
  .sidebar-backdrop.show{ display:block; opacity:1; }

  /* Responsive */
  @media(max-width:768px){
    body{
      height:100dvh; /* accounts for mobile browser chrome */
    }
    .sidebar{
      position:fixed;
      top:0; left:0;
      height:100%;
      height:100dvh;
      width:82%;
      max-width:300px;
      transform:translateX(-100%);
      box-shadow:0 0 40px #000a;
      padding-top:calc(18px + env(safe-area-inset-top));
    }
    .sidebar.show{ transform:translateX(0); }

    #toggle-sidebar{
      display:flex;
      align-items:center;
      justify-content:center;
      width:40px;
      height:40px;
      margin:-8px;
    }

    header{
      padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
    }
    .header-title{ font-size:15px; }
    .header-sub{ font-size:11px; }

    #chat-window{
      padding:18px 14px 10px;
      gap:18px;
    }
    .welcome{ margin:18px auto 0; padding:0 2px; }
    .welcome h1{ font-size:22px; }
    .welcome p{ font-size:13.5px; }

    .msg-row{ gap:9px; }
    .avatar{ width:28px; height:28px; border-radius:8px; font-size:12.5px; }
    .bubble{ max-width:86%; font-size:15px; padding:11px 14px; }

    .input-wrap{
      padding:10px 12px calc(14px + env(safe-area-inset-bottom));
    }
    .input-container{ padding:5px 5px 5px 16px; border-radius:24px; }
    .input-container input{
      /* 16px min prevents iOS Safari auto-zoom on focus */
      font-size:16px;
      padding:12px 0;
    }
    .input-container button{
      width:42px;
      height:42px;
    }
    .input-hint{ font-size:10px; padding:0 10px; }

    .recent-item{ padding:12px 10px; font-size:13px; }
    .new-chat-btn{ padding:13px 14px; font-size:14px; }
  }

  @media(max-width:380px){
    .bubble{ max-width:90%; font-size:14.5px; }
    .welcome h1{ font-size:20px; }
  }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-text">Aariz's AI<span>personal engine</span></div>
  </div>

  <button class="new-chat-btn" onclick="clearChat()">✦ New chat</button>

  <div class="section-label">Recent projects</div>
  <div class="recent-item"><code>ai_assistant_v1.py</code> <span class="tag tag-py">Python</span></div>
  <div class="recent-item"><code>web_ui_design.html</code> <span class="tag tag-html">HTML</span></div>
  <div class="recent-item"><code>image_generator.js</code> <span class="tag tag-js">JS</span></div>
  <div class="recent-item"><code>ml_model_train.ipynb</code> <span class="tag tag-nb">Notebook</span></div>

  <div class="sidebar-footer">Running on Llama 3 · Groq</div>
</div>

<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<div class="main-content">
  <header>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="toggle-sidebar">☰</button>
      <div>
        <div class="header-title">Aariz's AI</div>
        <div class="header-sub"><span class="status-dot"></span>Online</div>
      </div>
    </div>
  </header>

  <div id="chat-window">
    <div class="welcome" id="welcome">
      <svg class="welcome-logo" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="32" cy="32" r="31" fill="url(#logoGrad)" opacity="0.14"/>
        <!-- head -->
        <circle cx="32" cy="24" r="10" stroke="var(--ink)" stroke-width="2" fill="none"/>
        <!-- hoodie / body -->
        <path d="M14 56c1-11 8-17 18-17s17 6 18 17" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M20 40c-3 3-5 8-5 13M44 40c3 3 5 8 5 13" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" fill="none"/>
        <!-- glasses -->
        <circle cx="27.5" cy="24" r="4" stroke="var(--gold)" stroke-width="2" fill="none"/>
        <circle cx="36.5" cy="24" r="4" stroke="var(--gold)" stroke-width="2" fill="none"/>
        <line x1="31.5" y1="24" x2="32.5" y2="24" stroke="var(--gold)" stroke-width="2"/>
        <line x1="23.5" y1="23" x2="22" y2="22" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
        <line x1="40.5" y1="23" x2="42" y2="22" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop stop-color="var(--gold)"/>
            <stop offset="1" stop-color="var(--violet)"/>
          </linearGradient>
        </defs>
      </svg>
      <h1>Bhai, kaise ho?</h1>
      <p>KYA HUA</p>
    </div>
  </div>

  <div class="input-wrap">
    <div class="input-container">
      <input type="text" id="input" placeholder="Message Aariz's AI..." autocomplete="off">
      <button id="send-btn" onclick="send()">➤</button>
    </div>
    <div class="input-hint">Aariz's AI can make mistakes. Verify anything important.</div>
  </div>
</div>

<script>
// The frontend never touches the Groq key. It calls our own /api/chat
// endpoint, which holds the key server-side (see api/chat.js).
const API_URL = "/api/chat";

let sending = false;

async function send() {
  if (sending) return;

  const input = document.getElementById("input");
  const chat = document.getElementById("chat-window");
  const sendBtn = document.getElementById("send-btn");
  const userText = input.value.trim();
  if (!userText) return;

  document.getElementById("welcome")?.remove();

  // Render user message
  const userRow = document.createElement("div");
  userRow.className = "msg-row user-row";
  userRow.innerHTML = `<div class="bubble user-bubble">${escapeHtml(userText)}</div><div class="avatar user-avatar">A</div>`;
  chat.appendChild(userRow);
  input.value = "";
  sending = true;
  sendBtn.disabled = true;
  chat.scrollTop = chat.scrollHeight;

  // AI placeholder with typing dots
  const aiRow = document.createElement("div");
  aiRow.className = "msg-row";
  aiRow.innerHTML = `<div class="avatar ai-avatar">✦</div><div class="bubble ai-bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>`;
  chat.appendChild(aiRow);
  chat.scrollTop = chat.scrollHeight;

  const targetBubble = aiRow.querySelector('.ai-bubble');

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: userText })
    });

    const data = await response.json().catch(() => ({}));

    if (response.ok) {
      targetBubble.textContent = data.reply || "No response received.";
    } else {
      targetBubble.textContent = data.error || `Error ${response.status}: request failed`;
      targetBubble.classList.add("error");
    }
  } catch (error) {
    targetBubble.textContent = "Couldn't reach Aariz's AI. Check your network connection and try again.";
    targetBubble.classList.add("error");
    console.error(error);
  }

  sending = false;
  sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

function clearChat() {
  const chat = document.getElementById("chat-window");
  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <svg class="welcome-logo" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="32" cy="32" r="31" fill="url(#logoGrad)" opacity="0.14"/>
        <circle cx="32" cy="24" r="10" stroke="var(--ink)" stroke-width="2" fill="none"/>
        <path d="M14 56c1-11 8-17 18-17s17 6 18 17" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M20 40c-3 3-5 8-5 13M44 40c3 3 5 8 5 13" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="27.5" cy="24" r="4" stroke="var(--gold)" stroke-width="2" fill="none"/>
        <circle cx="36.5" cy="24" r="4" stroke="var(--gold)" stroke-width="2" fill="none"/>
        <line x1="31.5" y1="24" x2="32.5" y2="24" stroke="var(--gold)" stroke-width="2"/>
        <line x1="23.5" y1="23" x2="22" y2="22" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
        <line x1="40.5" y1="23" x2="42" y2="22" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop stop-color="var(--gold)"/>
            <stop offset="1" stop-color="var(--violet)"/>
          </linearGradient>
        </defs>
      </svg>
      <h1>Bhai, kaise ho?</h1>
      <p>KYA HUA</p>
    </div>`;
}

function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("sidebar-backdrop");

function openSidebar(){
  sidebar.classList.add("show");
  backdrop.classList.add("show");
}
function closeSidebar(){
  sidebar.classList.remove("show");
  backdrop.classList.remove("show");
}

document.getElementById("toggle-sidebar").addEventListener("click", () => {
  sidebar.classList.contains("show") ? closeSidebar() : openSidebar();
});
backdrop.addEventListener("click", closeSidebar);

// Close the drawer after picking a recent item or starting a new chat (mobile)
document.querySelectorAll(".recent-item, .new-chat-btn").forEach(el => {
  el.addEventListener("click", () => {
    if (window.innerWidth <= 768) closeSidebar();
  });
});

document.getElementById("input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") send();
});
</script>
</body>
</html>
